// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name.toLowerCase().contains("extract") && task.name.toLowerCase().contains("annotations")) {
            task.enabled = false
            def typedefFile = new File(task.project.buildDir, "intermediates/annotations_typedef_file/release/" + task.name + "/typedefs.txt")
            typedefFile.parentFile.mkdirs()
            typedefFile.text = ""
        }
    }
}
